name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  esp32-s3:
    runs-on: ubuntu-latest
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls "$ESP32_INDEX"
      - run: arduino-cli core install esp32:esp32@3.3.0 --additional-urls "$ESP32_INDEX"
      - run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/GuideCane
