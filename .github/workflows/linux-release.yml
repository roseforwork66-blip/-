name: Linux demo release

on:
  push:
    branches: [main]
    paths: ['linux/**', 'tools/demo*', 'firmware/GuideCane/**', 'CMakeLists.txt', '.github/workflows/linux-release.yml']
  pull_request:
    paths: ['linux/**', 'tools/demo*', 'firmware/GuideCane/**', 'CMakeLists.txt', '.github/workflows/linux-release.yml']

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build and desktop test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake desktop-file-utils dpkg-dev fonts-noto-cjk git libgtk-3-dev pkg-config xauth xvfb
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the GUI and run the Linux tests
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DSMART_GUIDE_CANE_LINUX_GUI=ON
          cmake --build build-linux --parallel
          ctest --test-dir build-linux --output-on-failure
      - name: Package and exercise both downloads
        shell: bash
        run: |
          set -euo pipefail
          bundle=SmartGuideCane-Linux-x86_64-v0.1.0
          mkdir -p dist stage verify-portable
          cmake --install build-linux --prefix "$PWD/stage/$bundle"
          tar -C stage -czf "dist/$bundle.tar.gz" "$bundle"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$PWD/dist"
          apt-get install -y "./dist/smart-guide-cane_0.1.0_amd64.deb"
          desktop-file-validate /usr/share/applications/smart-guide-cane.desktop
          xvfb-run -a /usr/bin/smart-guide-cane --smoke-test
          tar -C verify-portable -xzf "dist/$bundle.tar.gz"
          xvfb-run -a "verify-portable/$bundle/bin/smart-guide-cane" --smoke-test
          "verify-portable/$bundle/bin/smart-guide-cane-cli" blocked | grep -F 'stopped  obstacle  servo=off'
      - uses: actions/upload-artifact@v4
        with:
          name: smart-guide-cane-linux-x64
          path: |
            dist/smart-guide-cane_0.1.0_amd64.deb
            dist/SmartGuideCane-Linux-x86_64-v0.1.0.tar.gz
          if-no-files-found: error

  ubuntu:
    needs: debian
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smart-guide-cane-linux-x64
          path: dist/
      - name: Verify installation and launch on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/smart-guide-cane_0.1.0_amd64.deb xvfb xauth
          xvfb-run -a /usr/bin/smart-guide-cane --smoke-test
          /usr/bin/smart-guide-cane-cli scan-loss | grep -F 'stopped  scan-stale  servo=off'

  release:
    needs: [debian, ubuntu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: linux-v0.1.0-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: smart-guide-cane-linux-x64
          path: dist/
      - name: Publish the Linux demo release once
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_TAG: linux-v0.1.0
        run: |
          release_state=$(gh release view "$LINUX_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) || release_state=missing
          if [ "$release_state" = false ]; then
            echo "Release $LINUX_TAG already exists."
            exit 0
          fi
          if [ "$release_state" = true ]; then
            echo "A draft for $LINUX_TAG already exists; verify its assets before publishing." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$LINUX_TAG"; then
            echo "Tag $LINUX_TAG already exists; check its target before publishing." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          gh release create "$LINUX_TAG" dist/smart-guide-cane_0.1.0_amd64.deb dist/SmartGuideCane-Linux-x86_64-v0.1.0.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '双轮式智能导盲杖 Linux 演示 v0.1.0' \
            --notes-file linux/RELEASE-v0.1.0.md --prerelease --latest=false
